name: Pipeline Financeiro Diário

on:
  schedule:
    - cron: '0 21 * * 1-5' # Roda às 18:00 BRT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar os arquivos .parquet
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline
        run: python analise_acoes.py 

      - name: Arquivar Dados Bronze
        uses: actions/upload-artifact@v4
        with:
          name: dados-bronze
          path: data_lake/bronze/   
          retention-days: 7         # Configuração de auto-delete

      - name: Sincronizar e Salvar Dados
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 1. Adiciona todas as mudanças geradas (novos parquets/csvs)
          git add -A 
          
          # 2. Faz um commit preventivo para "limpar" o estágio
          git commit -m "Auto: atualização de dados via pipeline" || true 
          
          # 3. Pull com rebase priorizando as mudanças locais (estratégia ours)
          git pull origin main --rebase -X ours 
          
          # 4. Push final para o repositório
          git push origin main

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/pipeline_analise_acoes.log
          retention-days: 7 # O log apaga sozinho depois de 7 dias
      