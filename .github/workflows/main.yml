name: Pipeline Financeiro Diário

on:
  schedule:
    - cron: '0 21 * * 1-5' # Roda às 18:00 BRT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar os arquivos .parquet
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pipeline
        run: python analise_acoes.py 

      - name: Arquivar Dados Bronze
        uses: actions/upload-artifact@v4
        with:
          name: dados-bronze
          path: data_lake/bronze/   
          retention-days: 7         # Configuração de auto-delete

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Comando de diagnóstico: mostra o tamanho do arquivo no console do GitHub
          ls -lh logs/
          cat logs/pipeline_analise_acoes.log | head -n 5
          
          git add data_lake/gold/ data_lake/silver/ logs/
          
          # Se o log ainda estiver vazio por erro do Python, o commit não falha
          git commit -m "Dados e logs atualizados: $(date +'%Y-%m-%d')" || exit 0
          
          git pull origin main --rebase -X ours
          git push origin main

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/pipeline_analise_acoes.log
          retention-days: 7 # O log apaga sozinho depois de 7 dias
      